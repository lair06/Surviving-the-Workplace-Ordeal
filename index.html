<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六人成虎 ‧ 職場修仙傳 ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), 
                  url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    #weather-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .lightning-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.25);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.05s ease-out;
    }

    .top-toolbar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .audio-control, .toggle-ui-btn, .achieve-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .audio-control:hover, .toggle-ui-btn:hover, .achieve-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    .bgm-dropdown-container {
      position: relative;
    }

    .bgm-menu {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 10px;
      width: 175px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bgm-menu.show {
      display: flex;
    }

    .bgm-menu-item, .bgm-track-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: left;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .bgm-menu-item:hover, .bgm-track-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    .bgm-track-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
    }

    .menu-divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 2px 0;
    }

    .menu-label {
      font-size: 0.72rem;
      color: #94a3b8;
      padding: 2px 4px;
    }

    .ui-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 10;
    }

    .ui-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    .game-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
    }

    .header-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(56, 189, 248, 0.8);
      letter-spacing: 0.15em;
      font-weight: 900;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #cbd5e1;
      letter-spacing: 0.1em;
      margin-top: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* 🌫️ 1.05 新增：職場迷霧尺規專用樣式 */
    .fog-ruler-container {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    }

    .ruler-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .ruler-bar-bg {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #475569;
      margin-bottom: 8px;
    }

    .ruler-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7 0%, #38bdf8 100%);
      box-shadow: 0 0 8px #38bdf8;
      transition: width 0.4s ease;
    }

    .ruler-steps {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .ruler-step-item {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      background: rgba(30, 41, 59, 0.6);
      color: #64748b;
      border: 1px solid #334155;
    }

    .ruler-step-item.unlocked {
      color: #cbd5e1;
      border-color: #475569;
    }

    .ruler-step-item.active {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border-color: #38bdf8;
      font-weight: bold;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
    }

    .stats-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(30, 41, 59, 0.7);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      margin-bottom: 18px;
      font-size: 0.92rem;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .stat-item {
      color: #94a3b8;
    }

    .stat-item span {
      color: #38bdf8;
      font-weight: bold;
    }

    .event-box {
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid #38bdf8;
      padding: 14px;
      min-height: 85px;
      margin-bottom: 18px;
      font-size: 0.98rem;
      line-height: 1.6;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #38bdf8;
      color: #e2e8f0;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      text-align: left;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
      line-height: 1.4;
    }

    .choice-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
      transform: translateY(-2px);
    }

    .choice-btn:active {
      transform: translateY(1px);
    }

    .log-box {
      margin-top: 18px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #7dd3fc;
      max-height: 110px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(2, 6, 23, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      backdrop-filter: blur(10px);
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
      text-align: center;
      max-height: 85vh;
      overflow-y: auto;
    }

    .bg-option-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      text-align: left;
      transition: all 0.2s ease;
    }

    .bg-option-btn:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    .version-tag {
      position: fixed;
      bottom: 12px;
      right: 15px;
      font-size: 0.75rem;
      color: #64748b;
      font-family: monospace;
      letter-spacing: 0.05em;
      z-index: 100;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    .achievement-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 15px;
      text-align: left;
    }

    .achievement-item {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .achievement-item.unlocked {
      border-color: #facc15;
      background: rgba(250, 204, 21, 0.1);
    }

    .achievement-icon {
      font-size: 1.5rem;
    }

    .resume-box {
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 14px;
      margin: 15px 0;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.8;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="version-tag">v1.05</div>

  <div id="achievements-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #facc15; margin-bottom: 10px;">🏆 社畜成就勳章館 🏆</h2>
      <p style="font-size: 0.82rem; color: #cbd5e1;">記載你在職場輪迴中解鎖的各式傳奇稱號！</p>
      
      <div id="achievements-list" class="achievement-grid"></div>

      <button class="bg-option-btn" style="text-align: center; margin-top: 15px; font-weight: bold;" onclick="toggleAchievementsModal(false)">返回遊戲</button>
    </div>
  </div>

  <div id="resume-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #38bdf8; margin-bottom: 5px;">📜 職場修仙生涯履歷表 📜</h2>
      <div id="resume-content" class="resume-box"></div>
      <button class="choice-btn" style="text-align: center; width: 100%;" onclick="closeResumeAndReset()">🔄 重新投胎 (開始新一局)</button>
    </div>
  </div>

  <div id="origin-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="color: #38bdf8; margin-bottom: 10px;">⚡ 選擇你的職場出身 ⚡</h2>
      <p style="font-size: 0.88rem; color: #cbd5e1; margin-bottom: 15px;">不同的出身將決定你的初始氣運與職場體質！</p>
      
      <button class="bg-option-btn" onclick="selectOrigin('rich')">
        <b style="color: #facc15;">🏰 富家子弟</b><br>
        <span style="font-size: 0.82rem; color: #94a3b8;">有利條件：初始修為 +20,000、起步直升【扣血社畜】、免受部分扣血懲罰！</span>
      </button>

      <button class="bg-option-btn" onclick="selectOrigin('normal')">
        <b style="color: #38bdf8;">🏠 平民百姓</b><br>
        <span style="font-size: 0.82rem; color: #94a3b8;">標準開局：無特殊加成與負面條件，依靠自身努力渡劫。</span>
      </button>

      <button class="bg-option-btn" onclick="selectOrigin('beggar')">
        <b style="color: #ef4444;">🪨 街頭乞丐</b><br>
        <span style="font-size: 0.82rem; color: #94a3b8;">負面條件：初始健康 -30、初始修為僅 22,000、所有扣血事件額外損耗！</span>
      </button>
    </div>
  </div>

  <canvas id="weather-canvas"></canvas>
  <div id="lightning" class="lightning-flash"></div>

  <div class="top-toolbar">
    <button class="achieve-btn" onclick="toggleAchievementsModal(true)">🏆 成就</button>
    <button id="ui-btn" class="toggle-ui-btn" onclick="toggleUI()">👁️ </button>
    
    <div class="bgm-dropdown-container">
      <button id="bgm-btn" class="audio-control" onclick="toggleBgmMenu()">🎵 </button>
      <div id="bgm-menu" class="bgm-menu">
        <button id="bgm-toggle-btn" class="bgm-menu-item" onclick="toggleBGM()">▶️ 播放音樂</button>
        <hr class="menu-divider">
        <div class="menu-label">切換仙俠曲目：</div>
        <button class="bgm-track-btn active" onclick="selectTrack(0, this)">🎼 仙俠曲目 一</button>
        <button class="bgm-track-btn" onclick="selectTrack(1, this)">⚔️ 仙俠曲目 二</button>
        <button class="bgm-track-btn" onclick="selectTrack(2, this)">🍃 仙俠曲目 三</button>
      </div>
    </div>
  </div>

  <audio id="bgm" src="bgm1.mp3"></audio>
  <audio id="sfx-spin" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"></audio>
  <audio id="sfx-stop" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

  <div id="main-ui" class="ui-wrapper">
    <div class="game-card">
      <div class="header-banner">
        <h1>六人成虎 ‧ 職場修仙傳 ⚡</h1>
        <div class="subtitle">— 幹到退休飛昇，抑或是過勞化身怨靈？ —</div>
      </div>

      <!-- 🌫️ 1.05 新增：職場迷霧尺規面板 -->
      <div class="fog-ruler-container">
        <div class="ruler-header">
          <span>🌫️ 職場修仙天梯進度</span>
          <span id="ruler-progress-text">0%</span>
        </div>
        <div class="ruler-bar-bg">
          <div id="ruler-bar-fill" class="ruler-bar-fill"></div>
        </div>
        <div id="ruler-steps-container" class="ruler-steps"></div>
      </div>

      <div class="stats-panel">
        <div class="stat-item">出身：<span id="origin-name">未選擇</span></div>
        <div class="stat-item">境界：<span id="realm">試用實習生</span></div>
        <div class="stat-item">修為 (月薪)：<span id="salary">28,000</span></div>
        <div class="stat-item">壽元 (年齡)：<span id="age">22</span> 歲 / <span id="max-age">65</span></div>
        <div class="stat-item">健康度：<span id="health">100</span>%</div>
      </div>

      <div id="event-text" class="event-box">請選擇出身開局...</div>
      <div id="choices" class="choices-container"></div>
      <div id="game-log" class="log-box">修仙履歷展開...<br></div>
    </div>
  </div>

  <script>
    // 🚀 1.05 新增 3 個無厘頭職稱，擴充至 10 個境界
    const realms = [
      { name: "試用實習生", minSalary: 28000, nextSalary: 35000 },
      { name: "扣血社畜", minSalary: 35000, nextSalary: 48000 },
      { name: "萬年組長", minSalary: 48000, nextSalary: 65000 },
      { name: "甩鍋經理", minSalary: 65000, nextSalary: 90000 },
      { name: "畫餅總監", minSalary: 90000, nextSalary: 120000 },
      { name: "會議室霸主", minSalary: 120000, nextSalary: 160000 },  // 🆕 新增
      { name: "氣氛組副總", minSalary: 160000, nextSalary: 210000 },  // 🆕 新增
      { name: "資深顧問 (回聘)", minSalary: 210000, nextSalary: 280000 },
      { name: "門面吉祥物", minSalary: 280000, nextSalary: 380000 },  // 🆕 新增
      { name: "萬年老顧問 (幹到死)", minSalary: 380000, nextSalary: Infinity }
    ];

    const achievementsList = [
      { id: "richLady", title: "紅塵大圓滿", desc: "接受神秘富婆包養，成功脫離職場苦海。", icon: "💖" },
      { id: "laidOff", title: "優化淘汰者", desc: "在公司大裁員天劫中被 HR 優化解僱。", icon: "☠️" },
      { id: "jailGuard", title: "保全尊者", desc: "大打出手後坐牢 10 年，出獄轉職為保全。", icon: "⛓️" },
      { id: "scapegoat", title: "背鍋大師", desc: "單局內替公司坦傷或背鍋達 3 次以上。", icon: "🍲" },
      { id: "promoted", title: "萬年組長", desc: "首次順利渡劫晉升至【萬年組長】境界。", icon: "⚡" },
      { id: "retired65", title: "功成身退", desc: "幹到 65 歲選擇領取退休金圓滿退休。", icon: "🏖️" },
      { id: "ascended100", title: "百歲真仙", desc: "成功幹到 100 歲，功德圓滿飛昇仙界！", icon: "🎉" },
      { id: "slacker", title: "摸魚道人", desc: "單局內累計茶水間摸魚或打瞌睡達 5 次。", icon: "☕" }
    ];

    let state = {
      origin: "normal",
      realmIndex: 0,
      salary: 28000,
      age: 22,
      maxAge: 65,
      months: 0,
      health: 100,
      isDead: false,
      hasMetRichLady: false,
      isRehired: false,
      hasTriggered5YearChengDong: false,
      hasTriggeredGroupLeaderChengDong: false,
      scapegoatCount: 0,
      slackCount: 0,
      unlockedRealms: [0] // 👈 1.05 新增：已解鎖的職位 index 紀錄
    };

    function getSaveData() {
      const defaultSave = {
        unlockedAchievements: [],
        totalGames: 0,
        maxSalaryEver: 28000
      };
      const saved = localStorage.getItem("work_xiuxian_save");
      return saved ? JSON.parse(saved) : defaultSave;
    }

    function unlockAchievement(id) {
      const saveData = getSaveData();
      if (!saveData.unlockedAchievements.includes(id)) {
        saveData.unlockedAchievements.push(id);
        localStorage.setItem("work_xiuxian_save", JSON.stringify(saveData));
        const ach = achievementsList.find(a => a.id === id);
        if (ach) addLog(`🏆 <b style="color:#facc15;">解鎖成就【${ach.title}】！</b> ${ach.desc}`);
      }
    }

    function toggleAchievementsModal(show) {
      const modal = document.getElementById("achievements-modal");
      if (show) {
        const saveData = getSaveData();
        const listContainer = document.getElementById("achievements-list");
        listContainer.innerHTML = "";

        achievementsList.forEach(ach => {
          const isUnlocked = saveData.unlockedAchievements.includes(ach.id);
          const item = document.createElement("div");
          item.className = `achievement-item ${isUnlocked ? 'unlocked' : ''}`;
          item.innerHTML = `
            <div class="achievement-icon">${isUnlocked ? ach.icon : '🔒'}</div>
            <div>
              <b style="color: ${isUnlocked ? '#facc15' : '#94a3b8'};">${ach.title}</b><br>
              <span style="font-size:0.78rem; color:#94a3b8;">${ach.desc}</span>
            </div>
          `;
          listContainer.appendChild(item);
        });
        modal.style.display = "flex";
      } else {
        modal.style.display = "none";
      }
    }

    function selectOrigin(type) {
      state.origin = type;
      document.getElementById("origin-modal").style.display = "none";

      if (type === "rich") {
        state.salary = 48000;
        state.realmIndex = 1;
        state.health = 100;
        if (!state.unlockedRealms.includes(1)) state.unlockedRealms.push(1);
        addLog("🏰 【富家子弟】開局！帶著家族資源空降公司，初始修為大幅提升！");
      } else if (type === "beggar") {
        state.salary = 22000;
        state.health = 70;
        addLog("🪨 【街頭乞丐】開局！體力透支且身無分文，職場路途極度艱辛！");
      } else {
        addLog("🏠 【平民百姓】開局！踏實努力，步步為營。");

      "被隔壁同事伸展時的「人體工學椅」氣壓桿爆裂波及，當場化作冤魂。",
      "在茶水間連續狂飲 8 杯全糖特濃仙界美式咖啡，心臟過載當場羽化登仙。",
      "影印機卡紙時試圖用內力硬拔，結果被捲入「影印機時空裂隙」消失無蹤。",
      "午休微波便當因忘記拿掉鋁箔紙爆出天劫紫電，不幸當場渡劫失敗身亡。",
      "試圖徒手打死總經理「像蚊帳」身邊的仙界蚊子，結果被反震真氣震碎五臟六腑。",
      "聽到長官傳來「這很簡單，你順手抓一下數據」的聲音，因壓力過載當場心智崩潰暴斃。",
      "外出拜訪客戶下大雨忘記帶傘，在暴雨中狂奔被「社畜酸雨天劫」洗刷至骨肉消融。"
    ];

    const bgmTracks = ["bgm1.mp3", "bgm2.mp3", "bgm3.mp3"];
    let currentTrackIndex = 0;
    let isPlayingBGM = false;
    let isUiHidden = false;

    function initAudio() {
      const bgm = document.getElementById("bgm");
      bgm.addEventListener("ended", () => {
        currentTrackIndex = (currentTrackIndex + 1) % bgmTracks.length;
        playTrack(currentTrackIndex);
      });
    }

    function playTrack(index) {
      currentTrackIndex = index;
      const bgm = document.getElementById("bgm");
      bgm.pause();
      bgm.src = bgmTracks[index];
      bgm.load();

      const trackBtns = document.querySelectorAll('.bgm-track-btn');
      trackBtns.forEach((btn, i) => {
        if (i === index) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      if (isPlayingBGM) bgm.play().catch(e => console.log(e));
    }

    function toggleBgmMenu() {
      document.getElementById("bgm-menu").classList.toggle("show");
    }

    function toggleBGM() {
      const bgm = document.getElementById("bgm");
      const toggleBtn = document.getElementById("bgm-toggle-btn");
      const bgmMainBtn = document.getElementById("bgm-btn");

      if (!isPlayingBGM) {
        bgm.play().then(() => {
          toggleBtn.innerText = "⏸️ 關閉音樂";
          bgmMainBtn.innerText = "🔊 ";
          isPlayingBGM = true;
        });
      } else {
        bgm.pause();
        toggleBtn.innerText = "▶️ 播放音樂";
        bgmMainBtn.innerText = "🎵 ";
        isPlayingBGM = false;
      }
    }

    function selectTrack(index) {
      playTrack(index);
      if (!isPlayingBGM) toggleBGM();
    }

    function toggleUI() {
      const mainUi = document.getElementById("main-ui");
      isUiHidden = !isUiHidden;
      if (isUiHidden) mainUi.classList.add("ui-hidden");
      else mainUi.classList.remove("ui-hidden");
    }

    function initWeatherEffect() {
      const canvas = document.getElementById('weather-canvas');
      const ctx = canvas.getContext('2d');
      const lightning = document.getElementById('lightning');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const rainDrops = [];
      for (let i = 0; i < 150; i++) {
        rainDrops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 10 + 15
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;

        rainDrops.forEach(drop => {
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 2, drop.y + drop.length);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= 1;
          if (drop.y > height) {
            drop.y = -drop.length;
            drop.x = Math.random() * width;
          }
        });

        if (Math.random() < 0.015) {
          lightning.style.opacity = '1';
          setTimeout(() => { lightning.style.opacity = '0'; }, 60);
        }

        requestAnimationFrame(render);
      }
      render();
    }

    // 🌫️ 1.05 新增：職場迷霧尺規更新邏輯
    function updateFogRuler() {
      const currentRealm = realms[state.realmIndex];
      const stepsContainer = document.getElementById("ruler-steps-container");
      stepsContainer.innerHTML = "";

      // 渲染橫向尺規標籤
      realms.forEach((r, idx) => {
        const step = document.createElement("div");
        const isUnlocked = state.unlockedRealms.includes(idx);
        const isActive = idx === state.realmIndex;

        step.className = `ruler-step-item ${isUnlocked ? 'unlocked' : ''} ${isActive ? 'active' : ''}`;
        
        // 未解鎖的顯示迷霧標籤 🔒 ???
        if (isUnlocked) {
          step.innerText = `${idx + 1}. ${r.name}`;
        } else {
          step.innerText = `${idx + 1}. 🔒 ???`;
        }

        stepsContainer.appendChild(step);
      });

      // 計算目前薪水到下個門檻的填滿比例
      let progress = 0;
      if (currentRealm.nextSalary === Infinity) {
        progress = 100;
      } else {
        const base = currentRealm.minSalary;
        const target = currentRealm.nextSalary;
        progress = Math.min(100, Math.max(0, Math.floor(((state.salary - base) / (target - base)) * 100)));
      }

      document.getElementById("ruler-bar-fill").style.width = `${progress}%`;
      document.getElementById("ruler-progress-text").innerText = `晉升進度: ${progress}%`;
    }

    function updateUI() {
      const originNames = { rich: "富家子弟 🏰", normal: "平民百姓 🏠", beggar: "街頭乞丐 🪨" };
      document.getElementById("origin-name").innerText = originNames[state.origin];
      document.getElementById("realm").innerText = realms[state.realmIndex].name;
      document.getElementById("salary").innerText = state.salary.toLocaleString();
      document.getElementById("age").innerText = state.age;
      document.getElementById("max-age").innerText = state.maxAge;
      document.getElementById("health").innerText = state.health;

      updateFogRuler(); // 👈 更新迷霧尺規
      checkStatus();
    }

    function addLog(text) {
      const logBox = document.getElementById("game-log");
      logBox.innerHTML = `> ${text}<br>` + logBox.innerHTML;
    }

    function checkStatus() {
      if (state.health <= 0) {
        state.isDead = true;
        const deathReason = absurdDeaths[Math.floor(Math.random() * absurdDeaths.length)];
        triggerEndGame("身亡渡劫失敗", deathReason);
        return;
      }

      if (state.age >= state.maxAge) {
        state.isDead = true;
        if (state.maxAge === 65) {
          trigger65RetirementChoice();
        } else {
          unlockAchievement("ascended100");
          triggerEndGame("百歲真仙飛昇", "成功幹到 100 歲！公司頒發「萬年老社畜尊者」金牌，功德圓滿飛昇仙界！");
        }
        return;
      }

      const currentRealm = realms[state.realmIndex];
      if (state.salary >= currentRealm.nextSalary && state.realmIndex < realms.length - 1) {
        triggerTribulation();
      }
    }

    function triggerEndGame(endingTitle, endingDesc) {
      const saveData = getSaveData();
      saveData.totalGames++;
      if (state.salary > saveData.maxSalaryEver) saveData.maxSalaryEver = state.salary;
      localStorage.setItem("work_xiuxian_save", JSON.stringify(saveData));

      const yearsWorked = Math.floor(state.months / 6);
      const originNames = { rich: "富家子弟 🏰", normal: "平民百姓 🏠", beggar: "街頭乞丐 🪨" };

      const resumeContent = `
        <b>📌 結算結局：</b><span style="color:#facc15;">${endingTitle}</span><br>
        <b>📜 結局說明：</b>${endingDesc}<br><br>
        <hr style="border-color:#334155; margin:8px 0;">
        <b>👤 出身背景：</b>${originNames[state.origin]}<br>
        <b>💼 最終職位：</b>${realms[state.realmIndex].name}<br>
        <b>💰 最終月薪：</b>$${state.salary.toLocaleString()}<br>
        <b>⏳ 服役年資：</b>${yearsWorked} 年 (${state.months} 次決策)<br>
        <b>🍲 歷史背鍋：</b>${state.scapegoatCount} 次<br>
        <b>☕ 摸魚次數：</b>${state.slackCount} 次<br>
        <b>🏆 累計遊玩：</b>第 ${saveData.totalGames} 局
      `;

      document.getElementById("resume-content").innerHTML = resumeContent;
      document.getElementById("resume-modal").style.display = "flex";
    }

    function closeResumeAndReset() {
      document.getElementById("resume-modal").style.display = "none";
      resetGame();
    }

    function trigger65RetirementChoice() {
      document.getElementById("event-text").innerHTML = `👵 <b>【職場關鍵分歧：65 歲功成身退】</b><br>你今年滿 65 歲了！長官拿著退休結算單與【強行回聘續命合約】，問你的下一步打算：`;
      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      const retireBtn = document.createElement("button");
      retireBtn.className = "choice-btn";
      retireBtn.innerText = "🏖️ 【功成身退】領取退休金，安享晚年";
      retireBtn.onclick = () => {
        unlockAchievement("retired65");
        triggerEndGame("65歲榮退大圓滿", "順利辦理退休，帶著滿滿的退休金與健康的身體，過上了無憂無慮的悠閒生活！");
      };

      const rehireBtn = document.createElement("button");
      rehireBtn.className = "choice-btn";
      rehireBtn.innerText = "⚡ 【強行回聘續命陣】簽署合約，幹到 100 歲飛昇！";
      rehireBtn.onclick = () => {
        state.isDead = false;
        state.isRehired = true;
        state.maxAge = 100;
        addLog("⚠️ 長官對你施展【強行回聘續命陣】，壽元上限擴充至 100 歲，退而不休繼續幹！");
        updateUI();
        nextTurn();
      };

      choicesContainer.appendChild(retireBtn);
      choicesContainer.appendChild(rehireBtn);
    }

    function getRandomEventByWeight() {
      const isPromoted = state.realmIndex >= 2;

      let weights;
      if (isPromoted) {
        weights = [
          { category: 'rare', weight: 1 },
          { category: 'debuff', weight: 5 },
          { category: 'chengDong', weight: 5 },
          { category: 'reception', weight: 5 },
          { category: 'high7F', weight: 5 },
          { category: 'channel7F', weight: 8 },
          { category: 'overseas7F', weight: 8 },
          { category: 'exStaff', weight: 5 },
          { category: 'supervisor6F', weight: 9 },
          { category: 'marketing6F', weight: 9 },
          { category: 'purchasing6F', weight: 9 },
          { category: 'hr6F', weight: 8 },
          { category: 'edu6F', weight: 9 },
          { category: 'it6F', weight: 9 },
          { category: 'daily', weight: 5 }
        ];
      } else {
        weights = [
          { category: 'rare', weight: 1 },
          { category: 'debuff', weight: 5 },
          { category: 'chengDong', weight: 5 },
          { category: 'reception', weight: 5 },
          { category: 'exStaff', weight: 5 },
          { category: 'supervisor6F', weight: 12 },
          { category: 'marketing6F', weight: 12 },
          { category: 'purchasing6F', weight: 12 },
          { category: 'hr6F', weight: 11 },
          { category: 'edu6F', weight: 12 },
          { category: 'it6F', weight: 12 },
          { category: 'daily', weight: 5 }
        ];
      }

      const rand = Math.random() * 100;
      let cumulative = 0;
      let selectedCategory = 'daily';

      for (const item of weights) {
        cumulative += item.weight;
        if (rand < cumulative) {
          selectedCategory = item.category;
          break;
        }
      }

      const pool = categorizedEvents[selectedCategory];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function nextTurn() {
      if (state.isDead) return;

      state.months++;

      if (state.months > 0 && state.months % 6 === 0) {
        state.age++;
        const yearsWorked = Math.floor(state.months / 6);
        const bonusSalary = Math.floor(state.salary * (yearsWorked / 5) * 0.1);
        if (bonusSalary > 0) {
          state.salary += bonusSalary;
          addLog(`🧧 滿 ${yearsWorked} 年年終加薪！基於年資獲得額外月薪 +$${bonusSalary.toLocaleString()}！`);
        }
      }

      let randomEvent;

      if (state.months === 30 && !state.hasTriggered5YearChengDong) {
        state.hasTriggered5YearChengDong = true;
        randomEvent = chengDong5YearGuaranteeEvent;
      } 
      else if (state.realmIndex >= 2 && !state.hasTriggeredGroupLeaderChengDong) {
        state.hasTriggeredGroupLeaderChengDong = true;
        randomEvent = chengDongGroupLeaderGuaranteeEvent;
      }
      else if (state.months > 0 && state.months % 18 === 0) {
        randomEvent = periodicSlackingEvent;
      } 
      else {
        randomEvent = getRandomEventByWeight();
      }

      document.getElementById("event-text").innerHTML = randomEvent.text;

      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      randomEvent.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerText = choice.text;
        btn.onclick = () => {
          document.getElementById("sfx-spin").play().catch(e => {});

          if (choice.isScapegoat) {
            state.scapegoatCount++;
            if (state.scapegoatCount >= 3) unlockAchievement("scapegoat");
          }

          if (choice.isSlack) {
            state.slackCount++;
            if (state.slackCount >= 5) unlockAchievement("slacker");
          }

          if (choice.specialOutcome === "richLadyEnding") {
            state.isDead = true;
            unlockAchievement("richLady");
            triggerEndGame("紅塵大圓滿", "跟著富婆遠走高飛，享盡天倫之樂！");
            return;
          }

          if (choice.specialOutcome === "laidOffEnding") {
            state.isDead = true;
            unlockAchievement("laidOff");
            triggerEndGame("慘遭優化", "獻身賣屁股失敗，當場被 HR 發遣散費優化解僱！");
            return;
          }

          if (choice.specialOutcome === "jailGuardOutcome") {
            state.age += 10;
            state.health = 100;
            unlockAchievement("jailGuard");
            addLog("⛓️ 你坐牢 10 年後出獄當【保全尊者】，開啟職場第二人生！");
            updateUI();
            if (!state.isDead) nextTurn();
            return;
          }

          let healthChange = choice.health || 0;
          let salaryChange = choice.salary || 0;

          if (state.origin === "rich" && healthChange < 0) {
            healthChange = Math.round(healthChange * 0.8);
          }

          if (state.origin === "beggar" && healthChange < 0) {
            healthChange = Math.round(healthChange * 1.2);
          }

          state.health += healthChange;
          state.salary += salaryChange;
          if (state.health > 100) state.health = 100;
          if (choice.log) addLog(choice.log);
          
          updateUI();
          if (!state.isDead && state.salary < realms[state.realmIndex].nextSalary) {
            nextTurn();
          }
        };
        choicesContainer.appendChild(btn);
      });
    }

    function triggerTribulation() {
      const nextRealm = realms[state.realmIndex + 1];
      document.getElementById("event-text").innerHTML = `⚡ <b>【考績渡劫啟動】</b><br>評估升任為 <b>${nextRealm.name}</b>！`;
      
      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      const passBtn = document.createElement("button");
      passBtn.className = "choice-btn";
      passBtn.innerText = "⚡ 接受考績天劫審查";
      passBtn.onclick = () => {
        document.getElementById("sfx-stop").play().catch(e => {});
        const successRate = state.health / 100;
        if (Math.random() < successRate) {
          state.realmIndex++;
          if (!state.unlockedRealms.includes(state.realmIndex)) {
            state.unlockedRealms.push(state.realmIndex); // 👈 升官解鎖新迷霧標籤
          }
          if (state.realmIndex >= 2) unlockAchievement("promoted");
          addLog(`✨ 渡劫成功！升任為【${nextRealm.name}】！`);
          state.salary = Math.floor(state.salary * 1.1);
          updateUI();
          nextTurn();
        } else {
          state.health -= 30;
          addLog(`❌ 渡劫失敗！健康度下降！`);
          updateUI();
          if (state.health > 0) nextTurn();
        }
      };
      choicesContainer.appendChild(passBtn);
    }

    function resetGame() {
      state = { 
        origin: "normal", 
        realmIndex: 0, 
        salary: 28000, 
        age: 22, 
        maxAge: 65, 
        months: 0, 
        health: 100, 
        isDead: false, 
        hasMetRichLady: false, 
        isRehired: false,
        hasTriggered5YearChengDong: false,
        hasTriggeredGroupLeaderChengDong: false,
        scapegoatCount: 0,
        slackCount: 0,
        unlockedRealms: [0]
      };
      document.getElementById("origin-modal").style.display = "flex";
      document.getElementById("game-log").innerHTML = "重新投胎...<br>";
    }

    window.onload = () => {
      initAudio();
      initWeatherEffect();
    };
  </script>
