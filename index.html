<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六人成虎 ‧ 職場修仙傳 ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), 
                  url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    #weather-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .lightning-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.25);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.05s ease-out;
    }

    .top-toolbar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .audio-control, .toggle-ui-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .audio-control:hover, .toggle-ui-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    .bgm-dropdown-container {
      position: relative;
    }

    .bgm-menu {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 10px;
      width: 175px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bgm-menu.show {
      display: flex;
    }

    .bgm-menu-item, .bgm-track-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: left;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .bgm-menu-item:hover, .bgm-track-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    .bgm-track-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
    }

    .menu-divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 2px 0;
    }

    .menu-label {
      font-size: 0.72rem;
      color: #94a3b8;
      padding: 2px 4px;
    }

    .ui-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 10;
    }

    .ui-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    .game-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
    }

    .header-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(56, 189, 248, 0.8);
      letter-spacing: 0.15em;
      font-weight: 900;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #cbd5e1;
      letter-spacing: 0.1em;
      margin-top: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .stats-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(30, 41, 59, 0.7);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      margin-bottom: 18px;
      font-size: 0.92rem;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .stat-item {
      color: #94a3b8;
    }

    .stat-item span {
      color: #38bdf8;
      font-weight: bold;
    }

    .event-box {
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid #38bdf8;
      padding: 14px;
      min-height: 85px;
      margin-bottom: 18px;
      font-size: 0.98rem;
      line-height: 1.6;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #38bdf8;
      color: #e2e8f0;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      text-align: left;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
      line-height: 1.4;
    }

    .choice-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
      transform: translateY(-2px);
    }

    .choice-btn:active {
      transform: translateY(1px);
    }

    .log-box {
      margin-top: 18px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #7dd3fc;
      max-height: 110px;
      overflow-y: auto;
      line-height: 1.5;
    }

    /* 🎭 出身選擇彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(2, 6, 23, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      backdrop-filter: blur(10px);
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
      text-align: center;
    }

    .bg-option-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      text-align: left;
      transition: all 0.2s ease;
    }

    .bg-option-btn:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }
  </style>
</head>
<body>

  <!-- 🎭 出身選擇彈窗 -->
  <div id="origin-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="color: #38bdf8; margin-bottom: 10px;">⚡ 選擇你的職場出身 ⚡</h2>
      <p style="font-size: 0.88rem; color: #cbd5e1; margin-bottom: 15px;">不同的出身將決定你的初始氣運與職場體質！</p>
      
      <button class="bg-option-btn" onclick="selectOrigin('rich')">
        <b style="color: #facc15;">🏰 富家子弟</b><br>
        <span style="font-size: 0.82rem; color: #94a3b8;">有利條件：初始修為 +20,000、起步直升【扣血社畜】、免受部分扣血懲罰！</span>
      </button>

      <button class="bg-option-btn" onclick="selectOrigin('normal')">
        <b style="color: #38bdf8;">🏠 平民百姓</b><br>
        <span style="font-size: 0.82rem; color: #94a3b8;">標準開局：無特殊加成與負面條件，依靠自身努力渡劫。</span>
      </button>

      <button class="bg-option-btn" onclick="selectOrigin('beggar')">
        <b style="color: #ef4444;">🪨 街頭乞丐</b><br>
        <span style="font-size: 0.82rem; color: #94a3b8;">負面條件：初始健康 -30、初始修為僅 22,000、所有扣血事件額外損耗！</span>
      </button>
    </div>
  </div>

  <canvas id="weather-canvas"></canvas>
  <div id="lightning" class="lightning-flash"></div>

  <div class="top-toolbar">
    <button id="ui-btn" class="toggle-ui-btn" onclick="toggleUI()">👁️ </button>
    
    <div class="bgm-dropdown-container">
      <button id="bgm-btn" class="audio-control" onclick="toggleBgmMenu()">🎵 </button>
      <div id="bgm-menu" class="bgm-menu">
        <button id="bgm-toggle-btn" class="bgm-menu-item" onclick="toggleBGM()">▶️ 播放音樂</button>
        <hr class="menu-divider">
        <div class="menu-label">切換仙俠曲目：</div>
        <button class="bgm-track-btn active" onclick="selectTrack(0, this)">🎼 仙俠曲目 一</button>
        <button class="bgm-track-btn" onclick="selectTrack(1, this)">⚔️ 仙俠曲目 二</button>
        <button class="bgm-track-btn" onclick="selectTrack(2, this)">🍃 仙俠曲目 三</button>
      </div>
    </div>
  </div>

  <audio id="bgm" src="bgm1.mp3"></audio>
  <audio id="sfx-spin" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"></audio>
  <audio id="sfx-stop" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

  <div id="main-ui" class="ui-wrapper">
    <div class="game-card">
      <div class="header-banner">
        <h1>六人成虎 ‧ 職場修仙傳 ⚡</h1>
        <div class="subtitle">— 幹到 100 歲飛昇，抑或是過勞化身怨靈？ —</div>
      </div>

      <div class="stats-panel">
        <div class="stat-item">出身：<span id="origin-name">未選擇</span></div>
        <div class="stat-item">境界：<span id="realm">試用實習生</span></div>
        <div class="stat-item">修為 (月薪)：<span id="salary">28,000</span></div>
        <div class="stat-item">壽元 (年齡)：<span id="age">22</span> 歲 / 100</div>
        <div class="stat-item">健康度：<span id="health">100</span>%</div>
      </div>

      <div id="event-text" class="event-box">請選擇出身開局...</div>
      <div id="choices" class="choices-container"></div>
      <div id="game-log" class="log-box">修仙履歷展開...<br></div>
    </div>
  </div>

  <script>
    const realms = [
      { name: "試用實習生", minSalary: 28000, nextSalary: 35000 },
      { name: "扣血社畜", minSalary: 35000, nextSalary: 48000 },
      { name: "萬年組長", minSalary: 48000, nextSalary: 65000 },
      { name: "甩鍋經理", minSalary: 65000, nextSalary: 90000 },
      { name: "畫餅總監", minSalary: 90000, nextSalary: 150000 },
      { name: "資深顧問 (回聘)", minSalary: 150000, nextSalary: 250000 },
      { name: "萬年老顧問 (幹到死)", minSalary: 250000, nextSalary: Infinity }
    ];

    let state = {
      origin: "normal", // "rich", "normal", "beggar"
      realmIndex: 0,
      salary: 28000,
      age: 22,
      months: 0,
      health: 100,
      isDead: false,
      hasMetRichLady: false
    };

    function selectOrigin(type) {
      state.origin = type;
      document.getElementById("origin-modal").style.display = "none";

      if (type === "rich") {
        state.salary = 48000;
        state.realmIndex = 1; // 直升扣血社畜
        state.health = 100;
        addLog("🏰 【富家子弟】開局！帶著家族資源空降公司，初始修為大幅提升！");
      } else if (type === "beggar") {
        state.salary = 22000;
        state.health = 70; // 初始健康打折
        addLog("🪨 【街頭乞丐】開局！體力透支且身無分文，職場路途極度艱辛！");
      } else {
        addLog("🏠 【平民百姓】開局！踏實努力，步步為營。");
      }

      updateUI();
      nextTurn();
    }

    const rareRichLadyEvent = {
      text: "💎 <b>【極稀有隱藏事件：紅塵仙緣】</b><br>一位身價千億的神秘富婆遞給你一張黑卡與豪宅鑰匙，深情地對你說：「別再職場修仙了，跟我走，我包養你一生一世！」",
      choices: [
        { 
          text: "【雙宿雙飛】接過黑卡，化作一對鴛鴦遠走高飛，享盡天倫之樂！", 
          specialOutcome: "richLadyEnding"
        },
        { 
          text: "【一心求道】「多謝好意！即便要在職場輪迴千年，我也只為求道！」", 
          health: +30, 
          salary: +5000, 
          log: "你展現了無與倫比的社畜道心，震撼了富婆！她決定投資你的道業，贈與你鉅額修為與大補丹！" 
        }
      ]
    };

    const events = [
      {
        text: "同組同仁突然請長假去度假，主管直接把對方留下的龐大專案爛攤子全扔給你接手！",
        choices: [
          { text: "【默默熬夜接手】燃燒肝臟連夜加班補救", health: -15, salary: -1000, log: "爛攤子勉強收尾，健康與薪資雙雙下滑！" },
          { text: "【甩給實習生】分派給實習生處理，結果實習生出包連累你", health: -5, salary: -2000, log: "實習生嚴重出包，你被扣除績效獎金！" }
        ]
      },
      {
        text: "公司爆發嚴重產品品質危機上新聞！老闆為了保住高層顏面，要你這個基石出面坦傷背鍋！",
        choices: [
          { text: "【召開記者會】面帶微笑向全體大眾鞠躬道歉坦傷", health: -25, salary: -3000, log: "替公司擋下了輿論子彈，但你被記大過扣薪！" },
          { text: "【發聲明稿澄清】熬夜寫公關稿，被網友與老闆雙重暴擊", health: -15, salary: -1500, log: "公關稿被網友罵翻，老闆怪你辦事不力！" }
        ]
      },
      {
        text: "全公司唯一的廁所突然管線爆裂大維修！整天無法順暢排解生理壓力，大家怨氣沖天！",
        choices: [
          { text: "【硬吞強忍】憋尿憋便一整天，內力嚴重失調", health: -20, salary: -500, log: "忍到差點走火入魔！器官嚴重受損！" },
          { text: "【跑去對面超商】為了上廁所頻繁離座，被迫消費買咖啡", health: -10, salary: -1000, log: "被主管質疑離座，扣除當月出勤獎金！" }
        ]
      },
      {
        text: "你開著公司老舊公務車外出會客，不料在郊區路上意外撞到了路邊走出來的牛！",
        choices: [
          { text: "【賠償車損與牛隻】與農夫和解並吸收公務車修車自負額", health: -10, salary: -4000, log: "自掏腰包賠償農夫並支付修車費！" },
          { text: "【私下艱難談判】在烈日下與農夫談判兩小時耗盡精血", health: -15, salary: -2500, log: "談判耗盡精血，中暑且付出了和解金！" }
        ]
      },
      {
        text: "🚨 <b>【突發天劫：公司大裁員】</b><br>仙界景氣寒冬降臨！公司宣佈進行『大規模組織優化（裁員）』！",
        choices: [
          { text: "【賣屁股求榮】極力諂媚討好上級，試圖獻身保住飯碗", specialOutcome: "laidOffEnding" },
          { text: "【大打出手】忍無可忍！直接對長官發動拳腳大陣，痛打一頓", specialOutcome: "jailGuardOutcome" },
          { text: "【玉石俱焚】把核心系統資料加解密鎖死，大喊「裁了我明天公司就崩潰！」", health: -10, salary: +3000, log: "長官投鼠忌器，被迫加薪安撫你的社畜怨念！" }
        ]
      },
      {
        text: "這個月公司平平淡淡，沒有什麼大事發生，你按部就班地上班下班。",
        choices: [
          { text: "【平安是福】默默領薪水，安分守己", health: -2, salary: +500, log: "平凡的一個月過去了，修為微微提升。" },
          { text: "【茶水間摸魚】泡杯咖啡，跟旁邊同事閒聊", health: +5, salary: 0, log: "在茶水間補充了一點靈氣。" }
        ]
      }
    ];

    const absurdDeaths = [
      "在 6F 洗手間蹲到雙腳麻痺，不幸化身職場加班怨靈。",
      "被長官畫的「未來公司上市分紅」大餅當場噎死。",
      "背了太多同門師兄的黑鍋，脊椎過載爆裂而亡。",
      "連續加班 72 小時，精神走火入魔，把鍵盤當成靈石吞下。"
    ];

    const bgmTracks = ["bgm1.mp3", "bgm2.mp3", "bgm3.mp3"];
    let currentTrackIndex = 0;
    let isPlayingBGM = false;
    let isUiHidden = false;

    function initAudio() {
      const bgm = document.getElementById("bgm");
      bgm.addEventListener("ended", () => {
        currentTrackIndex = (currentTrackIndex + 1) % bgmTracks.length;
        playTrack(currentTrackIndex);
      });
    }

    function playTrack(index) {
      currentTrackIndex = index;
      const bgm = document.getElementById("bgm");
      bgm.pause();
      bgm.src = bgmTracks[index];
      bgm.load();

      const trackBtns = document.querySelectorAll('.bgm-track-btn');
      trackBtns.forEach((btn, i) => {
        if (i === index) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      if (isPlayingBGM) bgm.play().catch(e => console.log(e));
    }

    function toggleBgmMenu() {
      document.getElementById("bgm-menu").classList.toggle("show");
    }

    function toggleBGM() {
      const bgm = document.getElementById("bgm");
      const toggleBtn = document.getElementById("bgm-toggle-btn");
      const bgmMainBtn = document.getElementById("bgm-btn");

      if (!isPlayingBGM) {
        bgm.play().then(() => {
          toggleBtn.innerText = "⏸️ 關閉音樂";
          bgmMainBtn.innerText = "🔊 ";
          isPlayingBGM = true;
        });
      } else {
        bgm.pause();
        toggleBtn.innerText = "▶️ 播放音樂";
        bgmMainBtn.innerText = "🎵 ";
        isPlayingBGM = false;
      }
    }

    function selectTrack(index) {
      playTrack(index);
      if (!isPlayingBGM) toggleBGM();
    }

    function toggleUI() {
      const mainUi = document.getElementById("main-ui");
      isUiHidden = !isUiHidden;
      if (isUiHidden) mainUi.classList.add("ui-hidden");
      else mainUi.classList.remove("ui-hidden");
    }

    function initWeatherEffect() {
      const canvas = document.getElementById('weather-canvas');
      const ctx = canvas.getContext('2d');
      const lightning = document.getElementById('lightning');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const rainDrops = [];
      for (let i = 0; i < 150; i++) {
        rainDrops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 10 + 15
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;

        rainDrops.forEach(drop => {
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 2, drop.y + drop.length);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= 1;
          if (drop.y > height) {
            drop.y = -drop.length;
            drop.x = Math.random() * width;
          }
        });

        if (Math.random() < 0.015) {
          lightning.style.opacity = '1';
          setTimeout(() => { lightning.style.opacity = '0'; }, 60);
        }

        requestAnimationFrame(render);
      }
      render();
    }

    function updateUI() {
      const originNames = { rich: "富家子弟 🏰", normal: "平民百姓 🏠", beggar: "街頭乞丐 🪨" };
      document.getElementById("origin-name").innerText = originNames[state.origin];
      document.getElementById("realm").innerText = realms[state.realmIndex].name;
      document.getElementById("salary").innerText = state.salary.toLocaleString();
      document.getElementById("age").innerText = state.age;
      document.getElementById("health").innerText = state.health;

      checkStatus();
    }

    function addLog(text) {
      const logBox = document.getElementById("game-log");
      logBox.innerHTML = `> ${text}<br>` + logBox.innerHTML;
    }

    function checkStatus() {
      if (state.health <= 0) {
        state.isDead = true;
        const deathReason = absurdDeaths[Math.floor(Math.random() * absurdDeaths.length)];
        document.getElementById("event-text").innerHTML = `<b style="color:#ef4444;">☠️ 渡劫失敗（身亡）</b><br>${deathReason}`;
        document.getElementById("choices").innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 重新投胎 (重新開始)</button>`;
        return;
      }

      if (state.age >= 100) {
        document.getElementById("event-text").innerHTML = `<b style="color:#22c55e;">🎉 終極職場大圓滿（百歲真仙飛昇）</b><br>你成功幹到了 100 歲！功德圓滿飛昇仙界！`;
        document.getElementById("choices").innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 再來一世職場修仙</button>`;
        return;
      }

      const currentRealm = realms[state.realmIndex];
      if (state.salary >= currentRealm.nextSalary && state.realmIndex < realms.length - 1) {
        triggerTribulation();
      }
    }

    function nextTurn() {
      if (state.isDead) return;

      state.months++;
      if (state.months % 12 === 0) state.age++;

      let randomEvent;
      if (!state.hasMetRichLady && Math.random() < 0.001) {
        state.hasMetRichLady = true;
        randomEvent = rareRichLadyEvent;
      } else {
        randomEvent = events[Math.floor(Math.random() * events.length)];
      }
      
      document.getElementById("event-text").innerHTML = randomEvent.text;

      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      randomEvent.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerText = choice.text;
        btn.onclick = () => {
          document.getElementById("sfx-spin").play().catch(e => {});

          if (choice.specialOutcome === "richLadyEnding") {
            state.isDead = true;
            document.getElementById("event-text").innerHTML = `<b style="color:#eab308;">💖 隱藏結局【紅塵大圓滿】</b><br>你跟著富婆遠走高飛，享盡天倫之樂！`;
            choicesContainer.innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 再來一世職場修仙</button>`;
            return;
          }

          if (choice.specialOutcome === "laidOffEnding") {
            state.isDead = true;
            document.getElementById("event-text").innerHTML = `<b style="color:#ef4444;">☠️ 結局【慘遭優化】</b><br>你賣屁股失敗當場被裁員！`;
            choicesContainer.innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 重新投胎</button>`;
            return;
          }

          if (choice.specialOutcome === "jailGuardOutcome") {
            state.age += 10;
            state.health = 100;
            addLog("⛓️ 你坐牢 10 年後出獄當【保全尊者】，開啟職場第二人生！");
            updateUI();
            if (!state.isDead) nextTurn();
            return;
          }

          // ⚖️ 出身影響核心邏輯演算：
          let healthChange = choice.health || 0;
          let salaryChange = choice.salary || 0;

          // 富家子弟：扣血減少 20%
          if (state.origin === "rich" && healthChange < 0) {
            healthChange = Math.round(healthChange * 0.8);
          }

          // 街頭乞丐：扣血額外增加 20%
          if (state.origin === "beggar" && healthChange < 0) {
            healthChange = Math.round(healthChange * 1.2);
          }

          state.health += healthChange;
          state.salary += salaryChange;
          if (state.health > 100) state.health = 100;
          if (choice.log) addLog(choice.log);
          
          updateUI();
          if (!state.isDead && state.salary < realms[state.realmIndex].nextSalary) {
            nextTurn();
          }
        };
        choicesContainer.appendChild(btn);
      });
    }

    function triggerTribulation() {
      const nextRealm = realms[state.realmIndex + 1];
      document.getElementById("event-text").innerHTML = `⚡ <b>【考績渡劫啟動】</b><br>評估升任為 <b>${nextRealm.name}</b>！`;
      
      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      const passBtn = document.createElement("button");
      passBtn.className = "choice-btn";
      passBtn.innerText = "⚡ 接受考績天劫審查";
      passBtn.onclick = () => {
        document.getElementById("sfx-stop").play().catch(e => {});
        const successRate = state.health / 100;
        if (Math.random() < successRate) {
          state.realmIndex++;
          addLog(`✨ 渡劫成功！升任為【${nextRealm.name}】！`);
          state.salary = Math.floor(state.salary * 1.1);
          updateUI();
          nextTurn();
        } else {
          state.health -= 30;
          addLog(`❌ 渡劫失敗！健康度下降！`);
          updateUI();
          if (state.health > 0) nextTurn();
        }
      };
      choicesContainer.appendChild(passBtn);
    }

    function resetGame() {
      state = { origin: "normal", realmIndex: 0, salary: 28000, age: 22, months: 0, health: 100, isDead: false, hasMetRichLady: false };
      document.getElementById("origin-modal").style.display = "flex";
      document.getElementById("game-log").innerHTML = "重新投胎...<br>";
    }

    window.onload = () => {
      initAudio();
      initWeatherEffect();
    };
  </script>
</body>
</html>
