<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六人成虎 ‧ 職場修仙傳 ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), 
                  url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 🌧️ 雷雨 Canvas 背景畫布 */
    #weather-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* ⚡ 閃電全螢幕白光特效 */
    .lightning-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.25);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.05s ease-out;
    }

    /* ↗️ 右上角工具列容器 */
    .top-toolbar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    /* 🔊 & 👁️ 通用頂部按鈕樣式 */
    .audio-control, .toggle-ui-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .audio-control:hover, .toggle-ui-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    /* 🎵 音樂下拉選單容器 */
    .bgm-dropdown-container {
      position: relative;
    }

    .bgm-menu {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 10px;
      width: 175px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bgm-menu.show {
      display: flex;
    }

    .bgm-menu-item, .bgm-track-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: left;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .bgm-menu-item:hover, .bgm-track-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    .bgm-track-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
    }

    .menu-divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 2px 0;
    }

    .menu-label {
      font-size: 0.72rem;
      color: #94a3b8;
      padding: 2px 4px;
    }

    /* 📦 主要 UI 包裹區塊 */
    .ui-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 10;
    }

    .ui-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* 🎮 遊戲卡片 */
    .game-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
    }

    .header-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(56, 189, 248, 0.8);
      letter-spacing: 0.15em;
      font-weight: 900;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #cbd5e1;
      letter-spacing: 0.1em;
      margin-top: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* 📊 屬性面板 */
    .stats-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(30, 41, 59, 0.7);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      margin-bottom: 18px;
      font-size: 0.92rem;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .stat-item {
      color: #94a3b8;
    }

    .stat-item span {
      color: #38bdf8;
      font-weight: bold;
    }

    /* 📜 事件描述框 */
    .event-box {
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid #38bdf8;
      padding: 14px;
      min-height: 85px;
      margin-bottom: 18px;
      font-size: 0.98rem;
      line-height: 1.6;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 🎮 選擇按鈕 */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #38bdf8;
      color: #e2e8f0;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      text-align: left;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
      line-height: 1.4;
    }

    .choice-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
      transform: translateY(-2px);
    }

    .choice-btn:active {
      transform: translateY(1px);
    }

    /* 📜 修仙履歷日誌 */
    .log-box {
      margin-top: 18px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #7dd3fc;
      max-height: 110px;
      overflow-y: auto;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 🌧️ 雨滴 Canvas 與 ⚡ 閃電遮罩 -->
  <canvas id="weather-canvas"></canvas>
  <div id="lightning" class="lightning-flash"></div>

  <!-- ↗️ 右上角功能按鈕列 -->
  <div class="top-toolbar">
    <button id="ui-btn" class="toggle-ui-btn" onclick="toggleUI()">👁️ </button>
    
    <!-- 🎵 音樂下拉選單 -->
    <div class="bgm-dropdown-container">
      <button id="bgm-btn" class="audio-control" onclick="toggleBgmMenu()">🎵 </button>
      <div id="bgm-menu" class="bgm-menu">
        <button id="bgm-toggle-btn" class="bgm-menu-item" onclick="toggleBGM()">▶️ 播放音樂</button>
        <hr class="menu-divider">
        <div class="menu-label">切換仙俠曲目：</div>
        <button class="bgm-track-btn active" onclick="selectTrack(0, this)">🎼 仙俠曲目 一</button>
        <button class="bgm-track-btn" onclick="selectTrack(1, this)">⚔️ 仙俠曲目 二</button>
        <button class="bgm-track-btn" onclick="selectTrack(2, this)">🍃 仙俠曲目 三</button>
      </div>
    </div>
  </div>

  <!-- 🎵 音訊效果 -->
  <audio id="bgm" src="bgm1.mp3"></audio>
  <audio id="sfx-spin" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"></audio>
  <audio id="sfx-stop" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

  <!-- 📦 主要遊戲介面 -->
  <div id="main-ui" class="ui-wrapper">
    <div class="game-card">
      <div class="header-banner">
        <h1>六人成虎 ‧ 職場修仙傳 ⚡</h1>
        <div class="subtitle">— 幹到 100 歲飛昇，抑或是過勞化身怨靈？ —</div>
      </div>

      <!-- 📊 屬性面板 -->
      <div class="stats-panel">
        <div class="stat-item">境界：<span id="realm">試用實習生</span></div>
        <div class="stat-item">修為 (月薪)：<span id="salary">28,000</span></div>
        <div class="stat-item">壽元 (年齡)：<span id="age">22</span> 歲 / 100</div>
        <div class="stat-item">健康度：<span id="health">100</span>%</div>
      </div>

      <!-- 📜 事件描述區 -->
      <div id="event-text" class="event-box">陣法讀取中...</div>

      <!-- 🎮 選擇按鈕區 -->
      <div id="choices" class="choices-container"></div>

      <!-- 📜 修仙履歷日誌 -->
      <div id="game-log" class="log-box">修仙履歷展開...<br></div>
    </div>
  </div>

  <script>
    // 1. 境界（公司職位）
    const realms = [
      { name: "試用實習生", minSalary: 28000, nextSalary: 35000 },
      { name: "扣血社畜", minSalary: 35000, nextSalary: 48000 },
      { name: "萬年組長", minSalary: 48000, nextSalary: 65000 },
      { name: "甩鍋經理", minSalary: 65000, nextSalary: 90000 },
      { name: "畫餅總監", minSalary: 90000, nextSalary: 150000 },
      { name: "資深顧問 (回聘)", minSalary: 150000, nextSalary: 250000 },
      { name: "萬年老顧問 (幹到死)", minSalary: 250000, nextSalary: Infinity }
    ];

    // 2. 玩家初始狀態
    let state = {
      realmIndex: 0,
      salary: 28000,
      age: 22,
      months: 0,
      health: 100,
      isDead: false
    };

    // 🌟 極低機率隱藏事件：富婆相中
    const rareRichLadyEvent = {
      text: "💎 <b>【極稀有隱藏事件：紅塵仙緣】</b><br>一位身價千億的神秘富婆遞給你一張黑卡與豪宅鑰匙，深情地對你說：「別再職場修仙了，跟我走，我包養你一生一世！」",
      isRare: true,
      choices: [
        { 
          text: "【雙宿雙飛】接過黑卡，化作一對鴛鴦遠走高飛，享盡天倫之樂！", 
          specialOutcome: "richLadyEnding"
        },
        { 
          text: "【一心求道】「多謝好意！即便要在職場輪迴千年，我也只為求道！」", 
          health: +30, 
          salary: +5000, 
          log: "你展現了無與倫比的社畜道心，震撼了富婆！她決定投資你的道業，贈與你鉅額修為與大補丹！" 
        }
      ]
    };

    // 3. 隨性日常/爆笑事件庫
    const events = [
      // 🍃 --- 平淡無奇的日常 ---
      {
        text: "這個月公司平平淡淡，沒有什麼大事發生，你按部就班地上班下班。",
        choices: [
          { text: "【平安是福】默默領薪水，安分守己", health: -2, salary: +500, log: "平凡的一個月過去了，修為微微提升。" },
          { text: "【茶水間摸魚】泡杯咖啡，跟旁邊同事閒聊", health: +5, salary: 0, log: "在茶水間補充了一點靈氣。" }
        ]
      },

      // 🏰 ================== 7F 頂層仙界高層大陣 (職位鎖定：萬年組長以上) ================== 🏰
      {
        text: "7F 貴賓室傳來無上威壓！會長「張詠唱」、董事長「張釋戒」與監察人「鍋臂粉」同時開會，整層樓空氣瞬間凝結！",
        minRealmIndex: 2,
        choices: [
          { text: "【極速彎腰】行 90 度修仙大禮，高喊「各位長官萬福！」", health: -5, salary: +3000, log: "會長張詠唱對你微微點頭，職場修為大幅提升！" },
          { text: "【奉茶遞水】恭敬遞上特級靈芝茶給監察人「鍋臂粉」", health: +5, salary: +1500, log: "鍋臂粉非常滿意，賞賜了你特別獎金！" }
        ]
      },
      {
        text: "會長「張詠唱」突然在會議室走出來，要大家當場提出一個能讓公司營收翻倍的「世紀大戰略」。",
        minRealmIndex: 2,
        choices: [
          { text: "【極致畫餅】侃侃而談元宇宙與 AI 的結合計畫", health: -10, salary: +3500, log: "張詠唱聽得十分滿意，誇讚你有高層遠見！" },
          { text: "【低頭裝忙】狂敲計算機假裝在算數據", health: 0, salary: 0, log: "成功避開會長視線，保住一口真氣。" }
        ]
      },
      {
        text: "董事長「張釋戒」拿著一本經營哲學，問你對於公司「組織精簡與加班常態化」有何看法。",
        minRealmIndex: 2,
        choices: [
          { text: "【忠心耿耿】「董事長，我願化身基石，公司就是我的家！」", health: -15, salary: +3000, log: "張釋戒大為感動，稱讚你是公司中流砥柱！" },
          { text: "【官方回答】「一切聽從公司安排與戰略規劃。」", health: 0, salary: +500, log: "不功不過，平穩過關。" }
        ]
      },
      {
        text: "監察人「鍋臂粉」手持算盤突襲查帳，質疑你們部門這個月的文具報支費用超標了！",
        minRealmIndex: 2,
        choices: [
          { text: "【仔細核對】拿出完整的單據逐筆說明成本合理性", health: -10, salary: +1000, log: "鍋臂粉核對無誤，勉為其難批准報支。" },
          { text: "【自掏腰包】「夫人息怒，超出的部分我自己補上！」", health: +5, salary: -500, log: "鍋臂粉滿意地點頭，稱讚你懂得為公司著想。" }
        ]

      {
        text: "總經理「像蚊帳」突然下達最高等級防務指令，要求全公司徹查項目進度，且嚴禁向外透露半個字！",
        minRealmIndex: 2,
        choices: [
          { text: "【連夜整理】將所有進度包裝成「仙界機密專案 PPT」", health: -15, salary: +4000, log: "像蚊帳總經理深感滿意，決定重用你！" },

      },
      {
        text: "執行董事「煦速正」看似和藹地走過來，問你：「最近各部門的工作節奏，你覺得有需要調整的地方嗎？」",

        choices: [

          { text: "【官方客套】「目前各部門配合都很順暢，長官帶領得很好！」", health: 0, salary: +1000, log: "煦速正笑了笑，沒再多說。" }

      // 🛒 ================== 7F 通路部 (職位鎖定：萬年組長以上) ================== 🛒
      {
        text: "通路部「蒼元經理」、「蓮降副理」與「濕小姐」發動鋪貨大陣，要求本週內攻下所有大型通路市場！",
        minRealmIndex: 2,
        choices: [
          { text: "【狂發 Email】連夜聯繫所有經銷門市搶架位", health: -15, salary: +3500, log: "蒼元經理大讚你具備通路突破能力！" },
          { text: "【巡店摸魚】假裝出差考察門市，實則去喝下午茶", health: +15, salary: 0, log: "身心靈獲得極大療癒，健康度回升！" }
        ]
      },
      {
        text: "通路部「蒼元經理」丟下一份競品報告，要你立刻分析對方為什麼能佔據最好的陳列位置。",
        minRealmIndex: 2,
        choices: [
          { text: "【深入剖析】連夜做出一份競品通路策略分析圖表", health: -10, salary: +2500, log: "蒼元經理非常欣賞你的專業分析。" },
          { text: "【簡要回報】回報是對方給了更高的上架費", health: 0, salary: 0, log: "經理嘆了口氣，沒再繼續追問。" }
        ]
      },
      {
        text: "通路部「蓮降副理」突然出現在你身後，拍拍你的肩膀問：「這個月通路給我們的業績預估，達標了嗎？」",
        minRealmIndex: 2,
        choices: [
          { text: "【美化數據】拿出包含了預估潛在訂單的精美圖表", health: -10, salary: +3000, log: "蓮降副理滿意地點頭，賞賜了你保健食品。" },
          { text: "【誠實回報】「還差一點，正在全力追趕中！」", health: -10, salary: +1000, log: "副理叮嚀你要加緊腳步。" }
        ]
      },
      {
        text: "通路部「濕小姐」展現強大的溝通協調能力，幫忙處理掉了一大堆通路經銷商的抱怨電話。",
        minRealmIndex: 2,
        choices: [
          { text: "【送上甜點】買了一份下午茶表達感謝", health: +5, salary: -300, log: "濕小姐欣然接受，跨部門關係大躍進！" },
          { text: "【接手追蹤】接下剩餘的行政後續追蹤工作", health: -10, salary: +1500, log: "順利協助通路部完成後續作業。" }
        ]
      },

      // 🌐 ================== 7F 海外事業部 (職位鎖定：萬年組長以上) ================== 🌐

        minRealmIndex: 2,
        choices: [
          { text: "【英打神功】狂飆全英文 Email 與外商溝通細節", health: -10, salary: +3000, log: "張嫁瓷誇獎你具備國際事業部的即戰力！" },
          { text: "【Google 翻譯】用翻譯軟體快速過一遍送出", health: +5, salary: -500, log: "海外客戶雖然看懂了，但語氣有點生硬。" }
        ]
      },
      {
        text: "張嫁瓷問你，有沒有興趣協助海外事業部籌備下個月的跨國線上展會？",
        minRealmIndex: 2,

    // 🎶 本地 Repo 音樂路徑設定
    const bgmTracks = [
      "bgm1.mp3",
      "bgm2.mp3",
      "bgm3.mp3"
    ];

    let currentTrackIndex = 0;
    let isPlayingBGM = false;
    let isUiHidden = false;

    // 🎧 初始化音樂監聽：自動播放下一首＋無限循環
    function initAudio() {
      const bgm = document.getElementById("bgm");
      
      bgm.addEventListener("ended", () => {
        currentTrackIndex = (currentTrackIndex + 1) % bgmTracks.length;
        playTrack(currentTrackIndex);
      });
    }

    function playTrack(index) {
      currentTrackIndex = index;
      const bgm = document.getElementById("bgm");
      
      bgm.pause();
      bgm.src = bgmTracks[index];
      bgm.load();

      const trackBtns = document.querySelectorAll('.bgm-track-btn');
      trackBtns.forEach((btn, i) => {
        if (i === index) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      if (isPlayingBGM) {
        bgm.play().catch(e => console.log("Play interrupted:", e));
      }
    }

    function toggleBgmMenu() {
      const menu = document.getElementById("bgm-menu");
      menu.classList.toggle("show");
    }

    window.addEventListener('click', (e) => {
      const container = document.querySelector('.bgm-dropdown-container');
      if (container && !container.contains(e.target)) {
        document.getElementById("bgm-menu")?.classList.remove("show");
      }
    });

    function toggleBGM() {
      const bgm = document.getElementById("bgm");
      const toggleBtn = document.getElementById("bgm-toggle-btn");
      const bgmMainBtn = document.getElementById("bgm-btn");

      if (!isPlayingBGM) {
        bgm.play().then(() => {
          toggleBtn.innerText = "⏸️ 關閉音樂";
          bgmMainBtn.innerText = "🔊 ";
          isPlayingBGM = true;
        }).catch(e => {
          console.warn("Autoplay Error:", e);
        });
      } else {
        bgm.pause();
        toggleBtn.innerText = "▶️ 播放音樂";
        bgmMainBtn.innerText = "🎵 ";
        isPlayingBGM = false;
      }
    }

    function selectTrack(index, btnElement) {
      playTrack(index);
      if (!isPlayingBGM) toggleBGM();
    }

    function toggleUI() {
      const mainUi = document.getElementById("main-ui");
      const uiBtn = document.getElementById("ui-btn");

      if (!isUiHidden) {
        mainUi.classList.add("ui-hidden");
        uiBtn.innerText = "👁️ ";
        isUiHidden = true;
      } else {
        mainUi.classList.remove("ui-hidden");
        uiBtn.innerText = "👁️ ";
        isUiHidden = false;
      }
    }

    // 🌧️⚡ 下雨 + 閃電動畫引擎
    function initWeatherEffect() {
      const canvas = document.getElementById('weather-canvas');
      const ctx = canvas.getContext('2d');
      const lightning = document.getElementById('lightning');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const rainDrops = [];
      for (let i = 0; i < 150; i++) {
        rainDrops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 10 + 15,
          opacity: Math.random() * 0.4 + 0.2
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;

        rainDrops.forEach(drop => {
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 2, drop.y + drop.length);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= 1;

          if (drop.y > height) {
            drop.y = -drop.length;
            drop.x = Math.random() * width;
          }
        });

        if (Math.random() < 0.015) {
          lightning.style.opacity = '1';
          setTimeout(() => { lightning.style.opacity = '0'; }, 60);
          setTimeout(() => { 
            if (Math.random() < 0.5) {
              lightning.style.opacity = '0.8';
              setTimeout(() => { lightning.style.opacity = '0'; }, 40);
            }
          }, 100);
        }

        requestAnimationFrame(render);
      }

      render();
    }

    // 🎮 遊戲核心邏輯
    function updateUI() {
      document.getElementById("realm").innerText = realms[state.realmIndex].name;
      document.getElementById("salary").innerText = state.salary.toLocaleString();
      document.getElementById("age").innerText = state.age;
      document.getElementById("health").innerText = state.health;

      checkStatus();
    }

    function addLog(text) {
      const logBox = document.getElementById("game-log");
      logBox.innerHTML = `> ${text}<br>` + logBox.innerHTML;
    }

    function checkStatus() {
      if (state.health <= 0) {
        state.isDead = true;
        const deathReason = absurdDeaths[Math.floor(Math.random() * absurdDeaths.length)];
        document.getElementById("event-text").innerHTML = `<b style="color:#ef4444;">☠️ 渡劫失敗（身亡）</b><br>${deathReason}`;
        document.getElementById("choices").innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 重新投胎 (重新開始)</button>`;
        return;
      }

      // 幹到 100 歲大圓滿退休
      if (state.age >= 100) {
        document.getElementById("event-text").innerHTML = `<b style="color:#22c55e;">🎉 終極職場大圓滿（百歲真仙飛昇）</b><br>你成功幹到了 100 歲！公司頒發「萬年老社畜尊者」金牌，你功德圓滿飛昇仙界！`;
        document.getElementById("choices").innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 再來一世職場修仙</button>`;
        return;
      }

      // 65 歲時自動觸發「回聘續命陣」
      if (state.age === 65 && state.months % 12 === 0) {
        addLog("⚠️ 滿 65 歲！長官對你施展【強行回聘續命陣】，退而不休繼續幹！");
      }

      const currentRealm = realms[state.realmIndex];
      if (state.salary >= currentRealm.nextSalary && state.realmIndex < realms.length - 1) {
        triggerTribulation();
      }
    }

    function nextTurn() {
      if (state.isDead) return;

      state.months++;
      if (state.months % 12 === 0) state.age++;

      // 🎲 3% 的極低機率觸發「富婆相中」隱藏事件
      let randomEvent;
      if (Math.random() < 0.03) {
        randomEvent = rareRichLadyEvent;
      } else {
        // 🎯 依據玩家當前年齡、職位鎖定機制過濾可用事件
        const availableEvents = events.filter(e => {
          if (e.minAge && state.age < e.minAge) return false;
          if (e.minRealmIndex && state.realmIndex < e.minRealmIndex) return false;
          return true;
        });

        randomEvent = availableEvents[Math.floor(Math.random() * availableEvents.length)];
      }
      
      document.getElementById("event-text").innerHTML = randomEvent.text;

      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      randomEvent.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerText = choice.text;
        btn.onclick = () => {
          document.getElementById("sfx-spin").play().catch(e => {});

          // 🌹 觸發富婆包養隱藏結局
          if (choice.specialOutcome === "richLadyEnding") {
            state.isDead = true;
            document.getElementById("event-text").innerHTML = `<b style="color:#eab308;">💖 隱藏結局【紅塵大圓滿】</b><br>你跟著富婆搭乘私人飛機遠走高飛，住進海景豪宅，終生不再需要為了 KPI 燃燒精血。你享盡了人間天倫之樂，成功脫離苦海！`;
            choicesContainer.innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 再來一世職場修仙</button>`;
            return;
          }

          state.health += choice.health || 0;
          state.salary += choice.salary || 0;
          if (state.health > 100) state.health = 100;
          if (choice.log) addLog(choice.log);
          
          updateUI();
          if (!state.isDead && state.salary < realms[state.realmIndex].nextSalary) {
            nextTurn();
          }
        };
        choicesContainer.appendChild(btn);
      });
    }

    function triggerTribulation() {
      const nextRealm = realms[state.realmIndex + 1];
      document.getElementById("event-text").innerHTML = `⚡ <b>【考績渡劫啟動】</b><br>你的修為已達標！長官準備評估你是否能升任為 <b>${nextRealm.name}</b>！`;
      
      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      const passBtn = document.createElement("button");
      passBtn.className = "choice-btn";
      passBtn.innerText = "⚡ 接受考績天劫審查";
      passBtn.onclick = () => {
        document.getElementById("sfx-stop").play().catch(e => {});
        const successRate = state.health / 100;
        if (Math.random() < successRate) {
          state.realmIndex++;
          addLog(`✨ 渡劫成功！升任為【${nextRealm.name}】！`);
          state.salary = Math.floor(state.salary * 1.1);
          updateUI();
          nextTurn();
        } else {
          state.health -= 30;
          addLog(`❌ 渡劫失敗！被長官評定「態度不佳」，健康度下降！`);
          updateUI();
          if (state.health > 0) nextTurn();
        }
      };
      choicesContainer.appendChild(passBtn);
    }

    function resetGame() {
      state = { realmIndex: 0, salary: 28000, age: 22, months: 0, health: 100, isDead: false };
      document.getElementById("game-log").innerHTML = "重新投胎...<br>";
      updateUI();
      nextTurn();
    }

    window.onload = () => {
      initAudio();
      initWeatherEffect();
      updateUI();
      nextTurn();
    };
  </script>
</body>
</html>
