<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六人成虎 ‧ 職場修仙傳 ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), 
                  url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 🌧️ 雷雨 Canvas 背景畫布 */
    #weather-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* ⚡ 閃電全螢幕白光特效 */
    .lightning-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.25);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.05s ease-out;
    }

    /* ↗️ 右上角工具列容器 */
    .top-toolbar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    /* 🔊 & 👁️ 通用頂部按鈕樣式 */
    .audio-control, .toggle-ui-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .audio-control:hover, .toggle-ui-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    /* 🎵 音樂下拉選單容器 */
    .bgm-dropdown-container {
      position: relative;
    }

    .bgm-menu {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 10px;
      width: 175px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
      flex-direction: column;
      gap: 6px;
      z-index: 110;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bgm-menu.show {
      display: flex;
    }

    .bgm-menu-item, .bgm-track-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: left;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .bgm-menu-item:hover, .bgm-track-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    .bgm-track-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
    }

    .menu-divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 2px 0;
    }

    .menu-label {
      font-size: 0.72rem;
      color: #94a3b8;
      padding: 2px 4px;
    }

    /* 📦 主要 UI 包裹區塊 */
    .ui-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 10;
    }

    .ui-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* 🎮 遊戲卡片 */
    .game-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
    }

    .header-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(56, 189, 248, 0.8);
      letter-spacing: 0.15em;
      font-weight: 900;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #cbd5e1;
      letter-spacing: 0.1em;
      margin-top: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* 📊 屬性面板 */
    .stats-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(30, 41, 59, 0.7);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      margin-bottom: 18px;
      font-size: 0.92rem;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .stat-item {
      color: #94a3b8;
    }

    .stat-item span {
      color: #38bdf8;
      font-weight: bold;
    }

    /* 📜 事件描述框 */
    .event-box {
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid #38bdf8;
      padding: 14px;
      min-height: 85px;
      margin-bottom: 18px;
      font-size: 0.98rem;
      line-height: 1.6;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 🎮 選擇按鈕 */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #38bdf8;
      color: #e2e8f0;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      text-align: left;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
      line-height: 1.4;
    }

    .choice-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
      transform: translateY(-2px);
    }

    .choice-btn:active {
      transform: translateY(1px);
    }

    /* 📜 修仙履歷日誌 */
    .log-box {
      margin-top: 18px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #7dd3fc;
      max-height: 110px;
      overflow-y: auto;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 🌧️ 雨滴 Canvas 與 ⚡ 閃電遮罩 -->
  <canvas id="weather-canvas"></canvas>
  <div id="lightning" class="lightning-flash"></div>

  <!-- ↗️ 右上角功能按鈕列 -->
  <div class="top-toolbar">
    <button id="ui-btn" class="toggle-ui-btn" onclick="toggleUI()">👁️ </button>
    
    <!-- 🎵 音樂下拉選單 -->
    <div class="bgm-dropdown-container">
      <button id="bgm-btn" class="audio-control" onclick="toggleBgmMenu()">🎵 </button>
      <div id="bgm-menu" class="bgm-menu">
        <button id="bgm-toggle-btn" class="bgm-menu-item" onclick="toggleBGM()">▶️ 播放音樂</button>
        <hr class="menu-divider">
        <div class="menu-label">切換仙俠曲目：</div>
        <button class="bgm-track-btn active" onclick="selectTrack(0, this)">🎼 仙俠曲目 一</button>
        <button class="bgm-track-btn" onclick="selectTrack(1, this)">⚔️ 仙俠曲目 二</button>
        <button class="bgm-track-btn" onclick="selectTrack(2, this)">🍃 仙俠曲目 三</button>
      </div>
    </div>
  </div>

  <!-- 🎵 音訊效果 -->
  <audio id="bgm" src="bgm1.mp3"></audio>
  <audio id="sfx-spin" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"></audio>
  <audio id="sfx-stop" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

  <!-- 📦 主要遊戲介面 -->
  <div id="main-ui" class="ui-wrapper">
    <div class="game-card">
      <div class="header-banner">
        <h1>六人成虎 ‧ 職場修仙傳 ⚡</h1>
        <div class="subtitle">— 幹到 100 歲飛昇，抑或是過勞化身怨靈？ —</div>
      </div>

      <!-- 📊 屬性面板 -->
      <div class="stats-panel">
        <div class="stat-item">境界：<span id="realm">試用實習生</span></div>
        <div class="stat-item">修為 (月薪)：<span id="salary">28,000</span></div>
        <div class="stat-item">壽元 (年齡)：<span id="age">22</span> 歲 / 100</div>
        <div class="stat-item">健康度：<span id="health">100</span>%</div>
      </div>

      <!-- 📜 事件描述區 -->
      <div id="event-text" class="event-box">陣法讀取中...</div>

      <!-- 🎮 選擇按鈕區 -->
      <div id="choices" class="choices-container"></div>

      <!-- 📜 修仙履歷日誌 -->
      <div id="game-log" class="log-box">修仙履歷展開...<br></div>
    </div>
  </div>

  <script>
    // 1. 境界（公司職位）
    const realms = [
      { name: "試用實習生", minSalary: 28000, nextSalary: 35000 },
      { name: "扣血社畜", minSalary: 35000, nextSalary: 48000 },
      { name: "萬年組長", minSalary: 48000, nextSalary: 65000 },
      { name: "甩鍋經理", minSalary: 65000, nextSalary: 90000 },
      { name: "畫餅總監", minSalary: 90000, nextSalary: 150000 },
      { name: "資深顧問 (回聘)", minSalary: 150000, nextSalary: 250000 },
      { name: "萬年老顧問 (幹到死)", minSalary: 250000, nextSalary: Infinity }
    ];

    // 2. 玩家初始狀態
    let state = {
      realmIndex: 0,
      salary: 28000,
      age: 22,
      months: 0,
      health: 100,
      isDead: false
    };

    // 3. 爆笑沙雕超大事件庫
    const events = [
      // --- 幕僚檢督人 ---
      {
        text: "幕僚檢督人「塵協理」開啟天劫法眼巡視各部門，眼神所到之處皆為焦土！",
        choices: [
          { text: "【端正坐姿】敲擊鍵盤發出陣陣修仙陣響", health: -5, salary: +1000, log: "塵協理點了點頭，認為你頗具社畜慧根。" },
          { text: "【隱身遁形】瞬間壓低螢幕視窗切換成 Excel", health: +5, salary: 0, log: "你成功避開法眼，保住一口真氣。" }
        ]
      },
      {
        text: "塵協理突然空降會議室，要求抽查所有人的「修仙週報與 KPI 陣法圖」。",
        choices: [
          { text: "【極限吹噓】將打雜工作包裝成「仙界戰略佈局」", health: -10, salary: +2500, log: "塵協理大為讚賞，稱你是公司的社畜棟樑！" },
          { text: "【誠實交卷】誠實列出這週只完成了 2 件小事", health: +5, salary: -1000, log: "塵協理冷笑一聲，將你列入重點關照名單。" }
        ]
      },

      // --- 行銷企劃 & 美編 ---
      {
        text: "行銷企畫「榴主任」與「黃尾」聯手發起【爆款文案大陣】，要求 10 分鐘內產出 100 個提案！",
        choices: [
          { text: "【ChatGPT 附體】召喚 AI 靈寵生成文案", health: 0, salary: +2000, log: "榴主任與黃尾大為震撼，讚賞你的靈寵法力無邊！" },
          { text: "【強行燃血】硬寫到腦袋發麻", health: -15, salary: +1500, log: "文案順利通過，但你的腦細胞大量損耗。" }
        ]
      },
      {
        text: "行銷美編「瘀華」與「捲爺」面容枯槁，丟出一份名為《V99_最終版_真的最後改.psd》的修仙圖檔。",
        choices: [
          { text: "【送上咖啡】祭出續命靈藥安撫美編", health: +5, salary: -500, log: "瘀華與捲爺大受感動，決定幫你的圖稿優先排版！" },
          { text: "【提出微調】「這裡能不能再放大一點加個光暈？」", health: -20, salary: 0, log: "捲爺發怒觸發「美編怨念天劫」，你的健康度大幅下降！" }
        ]
      },
      {
        text: "黃尾突然跑來對你說：「榴主任說這個主視覺要『五彩斑斕的黑』，美編瘀華已經快成魔了，怎麼辦？」",
        choices: [
          { text: "【和稀泥話術】「我們把黑色調亮 10% 試試！」", health: -5, salary: +1000, log: "成功糊弄過去，美編與主任暫時達成和平協定。" },
          { text: "【火上澆油】「我覺得字體要換成新細明體加粗！」", health: -25, salary: 0, log: "美編瘀華與捲爺起兵造反，你被殃及池魚慘扣健康度！" }
        ]
      },

      // --- 採購 ---
      {
        text: "採購經理「症經理」與「林小姐」砍價法術大發，要求你找便宜 50% 的靈石（供應商）。",
        choices: [
          { text: "【施展話術】對供應商展開修仙式道德綁架", health: -10, salary: +3000, log: "成功的將價格砍下，症經理與林小姐大加讚賞！" },
          { text: "【攤手擺爛】「這個價格真的買不到啊！」", health: 0, salary: -1000, log: "採購部門對你施加「資材凍結術」。" }
        ]
      },
      {
        text: "林小姐拿著採購單找到你：「症經理說這筆預算少了一個零，叫你想辦法生出來。」",
        choices: [
          { text: "【掏空私房錢】先墊付靈石再慢慢報帳", health: -15, salary: +2000, log: "墊錢事小，但報帳流程拖了半年…" },
          { text: "【尋求靈石淘寶】找劣質替代品濫竽充數", health: -5, salary: +500, log: "勉強過關，但物品用了一一次就壞了。" }
        ]
      },

      // --- 人資部 ---
      {
        text: "人資四多花「琳達、珈稜、熟君、莉鏡」四位仙姑佈下【考績天劫陣】，對你進行心靈審問。",
        choices: [
          { text: "【極致畫餅】講述自己對公司未來 10 年的修仙規劃", health: -5, salary: +4000, log: "四仙姑深受感動，評定你為優秀弟子！" },
          { text: "【實話實說】「我只是來賺錢買飯吃的。」", health: +10, salary: -2000, log: "四仙姑搖了搖頭，記錄下你的心魔過重。" }
        ]
      },
      {
        text: "人資「丞董」悄悄走過來，掏出一本光芒四射的《離職心法殘卷》，原來他即將飛昇跳槽！",
        choices: [
          { text: "【參悟傳承】向丞董討教飛昇密技", health: +10, salary: +2000, log: "你領悟了「仙界履歷包裝術」，市場身價提升！" },
          { text: "【熱情祝福】祝賀丞董脫離苦海", health: +5, salary: 0, log: "丞董給了你一顆靈石（請你喝手搖飲）。" }
        ]
      },
      {
        text: "人資「噸鸣」發動「神龍見首不見尾」大術：早上 8 點進公司、9 點出門，下午 4 點回來、5 點下班，總結：極度忙碌！",
        choices: [
          { text: "【堵人蓋章】在其出沒的黃金 10 分鐘內發動攔截", health: -5, salary: +1500, log: "成功攔截噸鳴蓋到章！公文順利推進！" },
          { text: "【錯過時機】等你想找人時，噸鳴早已遁地離去", health: 0, salary: 0, log: "你只能對著空的辦公桌發呆。" }
        ]
      },

      // --- 教育中心 ---
      {
        text: "教育中心「小輓、星蚊、龜董、柯董」發起全員精神洗腦大會【職場心靈渡劫課】！",
        choices: [
          { text: "【閉目冥想】表面點頭，實則坐在後排閉目養神", health: +15, salary: 0, log: "獲得極佳的睡眠，健康度大幅提升！" },
          { text: "【積極互動】舉手回答龜董與柯董的靈魂發問", health: -10, salary: +2500, log: "獲得龜董與柯董讚許，獎勵修為提升！" }
        ]
      },
      {
        text: "小輓與星蚊突襲檢查：「請在 3 分鐘內說出公司的核心修仙價值觀！」",
        choices: [
          { text: "【背誦心法】「加班、奉獻、共創雙贏！」", health: -5, salary: +1000, log: "小輓與星蚊滿意地遞給你一顆仙丹（喉糖）。" },
          { text: "【裝傻充愣】「蛤？公司不是只賣便當嗎？」", health: 0, salary: -500, log: "被罰重新上 2 小時修仙心靈課程。" }
        ]
      },

      // --- 資訊中心 ---
      {
        text: "你的電腦系統突然崩潰！緊急聯繫資訊中心「煌經理」，結果獲得【已讀亂回】貼圖連發！",
        choices: [
          { text: "【召喚資訊天團】轉向尋求廖董、周先生、許先生、謝先生救援", health: +5, salary: +1000, log: "資訊天團發動「重開機大術」，系統瞬間恢復！" },
          { text: "【繼續跟煌經理對話】試圖解讀已讀亂回背後的玄機", health: -15, salary: 0, log: "你走火入魔，陷入深深的自我懷疑。" }
        ]
      },
      {
        text: "廖董、周先生、許先生、謝先生組成「IT 四天王陣」，宣佈要進行全公司網路大斷網升級！",
        choices: [
          { text: "【理智摸魚】趁機光正大地放空滑手機", health: +15, salary: 0, log: "沒有網路的世界太美好了，健康度大幅回復！" },
          { text: "【開手機熱點】繼續拼命敲 Code 加班", health: -15, salary: +2000, log: "你得到了「極度敬業」稱號，但腰椎快斷了。" }
        ]
      },

      // --- 老年爆笑幹到死事件 (65 歲以上限定感受) ---
      {
        text: "你今年 75 歲了，後輩問你為什麼還不退休，你指了指身後長官畫的大餅...",
        choices: [
          { text: "【老當益壯】大喊「我還能加班！」並吃下一顆老天祿", health: -10, salary: +3000, log: "全公司都被你這股幹到死的社畜精神震懾！" },
          { text: "【拄拐摸魚】靠著老資歷在辦公室安詳打瞌睡", health: +20, salary: 0, log: "無人敢叫醒你，健康度得到養生補給！" }
        ]
      }
    ];

    // 4. 荒謬死法庫
    const absurdDeaths = [
      "在 6F 洗手間蹲到雙腳麻痺，不幸化身職場加班怨靈。",
      "被龜董與柯董畫的「未來公司上市分紅」大餅當場噎死。",
      "背了太多同門師兄的黑鍋，脊椎過載爆裂而亡。",
      "連續加班 72 小時，精神走火入魔，把鍵盤當成靈石吞下。",
      "在 99 歲高齡時被煌經理的【已讀亂回】貼圖氣到心肌梗塞。",
      "幫美編捲爺與瘀華改第 100 版 PSD 圖檔時，精血耗盡身亡。"
    ];

    // 🎶 本地 Repo 音樂路徑設定
    const bgmTracks = [
      "bgm1.mp3",
      "bgm2.mp3",
      "bgm3.mp3"
    ];

    let currentTrackIndex = 0;
    let isPlayingBGM = false;
    let isUiHidden = false;

    // 🎧 初始化音樂監聽：自動播放下一首＋無限循環
    function initAudio() {
      const bgm = document.getElementById("bgm");
      
      bgm.addEventListener("ended", () => {
        currentTrackIndex = (currentTrackIndex + 1) % bgmTracks.length;
        playTrack(currentTrackIndex);
      });
    }

    function playTrack(index) {
      currentTrackIndex = index;
      const bgm = document.getElementById("bgm");
      
      bgm.pause();
      bgm.src = bgmTracks[index];
      bgm.load();

      const trackBtns = document.querySelectorAll('.bgm-track-btn');
      trackBtns.forEach((btn, i) => {
        if (i === index) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      if (isPlayingBGM) {
        bgm.play().catch(e => console.log("Play interrupted:", e));
      }
    }

    function toggleBgmMenu() {
      const menu = document.getElementById("bgm-menu");
      menu.classList.toggle("show");
    }

    window.addEventListener('click', (e) => {
      const container = document.querySelector('.bgm-dropdown-container');
      if (container && !container.contains(e.target)) {
        document.getElementById("bgm-menu")?.classList.remove("show");
      }
    });

    function toggleBGM() {
      const bgm = document.getElementById("bgm");
      const toggleBtn = document.getElementById("bgm-toggle-btn");
      const bgmMainBtn = document.getElementById("bgm-btn");

      if (!isPlayingBGM) {
        bgm.play().then(() => {
          toggleBtn.innerText = "⏸️ 關閉音樂";
          bgmMainBtn.innerText = "🔊 ";
          isPlayingBGM = true;
        }).catch(e => {
          console.warn("Autoplay Error:", e);
        });
      } else {
        bgm.pause();
        toggleBtn.innerText = "▶️ 播放音樂";
        bgmMainBtn.innerText = "🎵 ";
        isPlayingBGM = false;
      }
    }

    function selectTrack(index, btnElement) {
      playTrack(index);
      if (!isPlayingBGM) toggleBGM();
    }

    function toggleUI() {
      const mainUi = document.getElementById("main-ui");
      const uiBtn = document.getElementById("ui-btn");

      if (!isUiHidden) {
        mainUi.classList.add("ui-hidden");
        uiBtn.innerText = "👁️ ";
        isUiHidden = true;
      } else {
        mainUi.classList.remove("ui-hidden");
        uiBtn.innerText = "👁️ ";
        isUiHidden = false;
      }
    }

    // 🌧️⚡ 下雨 + 閃電動畫引擎
    function initWeatherEffect() {
      const canvas = document.getElementById('weather-canvas');
      const ctx = canvas.getContext('2d');
      const lightning = document.getElementById('lightning');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const rainDrops = [];
      for (let i = 0; i < 150; i++) {
        rainDrops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 10 + 15,
          opacity: Math.random() * 0.4 + 0.2
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;

        rainDrops.forEach(drop => {
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 2, drop.y + drop.length);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= 1;

          if (drop.y > height) {
            drop.y = -drop.length;
            drop.x = Math.random() * width;
          }
        });

        if (Math.random() < 0.015) {
          lightning.style.opacity = '1';
          setTimeout(() => { lightning.style.opacity = '0'; }, 60);
          setTimeout(() => { 
            if (Math.random() < 0.5) {
              lightning.style.opacity = '0.8';
              setTimeout(() => { lightning.style.opacity = '0'; }, 40);
            }
          }, 100);
        }

        requestAnimationFrame(render);
      }

      render();
    }

    // 🎮 遊戲核心邏輯
    function updateUI() {
      document.getElementById("realm").innerText = realms[state.realmIndex].name;
      document.getElementById("salary").innerText = state.salary.toLocaleString();
      document.getElementById("age").innerText = state.age;
      document.getElementById("health").innerText = state.health;

      checkStatus();
    }

    function addLog(text) {
      const logBox = document.getElementById("game-log");
      logBox.innerHTML = `> ${text}<br>` + logBox.innerHTML;
    }

    function checkStatus() {
      if (state.health <= 0) {
        state.isDead = true;
        const deathReason = absurdDeaths[Math.floor(Math.random() * absurdDeaths.length)];
        document.getElementById("event-text").innerHTML = `<b style="color:#ef4444;">☠️ 渡劫失敗（身亡）</b><br>${deathReason}`;
        document.getElementById("choices").innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 重新投胎 (重新開始)</button>`;
        return;
      }

      // 幹到 100 歲大圓滿退休
      if (state.age >= 100) {
        document.getElementById("event-text").innerHTML = `<b style="color:#22c55e;">🎉 終極職場大圓滿（百歲真仙飛昇）</b><br>你成功幹到了 100 歲！公司頒發「萬年老社畜尊者」金牌，你帶著億萬退休金功德圓滿飛昇仙界！`;
        document.getElementById("choices").innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 再來一世職場修仙</button>`;
        return;
      }

      // 65 歲時自動觸發「回聘續命陣」
      if (state.age === 65 && state.months % 12 === 0) {
        addLog("⚠️ 滿 65 歲！長官對你施展【強行回聘續命陣】，你被迫退而不休繼續幹！");
      }

      const currentRealm = realms[state.realmIndex];
      if (state.salary >= currentRealm.nextSalary && state.realmIndex < realms.length - 1) {
        triggerTribulation();
      }
    }

    function nextTurn() {
      if (state.isDead) return;

      state.months++;
      if (state.months % 12 === 0) state.age++;

      const randomEvent = events[Math.floor(Math.random() * events.length)];
      document.getElementById("event-text").innerText = randomEvent.text;

      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      randomEvent.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerText = choice.text;
        btn.onclick = () => {
          document.getElementById("sfx-spin").play().catch(e => {});
          state.health += choice.health;
          state.salary += choice.salary;
          if (state.health > 100) state.health = 100;
          addLog(choice.log);
          updateUI();
          if (!state.isDead && state.salary < realms[state.realmIndex].nextSalary) {
            nextTurn();
          }
        };
        choicesContainer.appendChild(btn);
      });
    }

    function triggerTribulation() {
      const nextRealm = realms[state.realmIndex + 1];
      document.getElementById("event-text").innerHTML = `⚡ <b>【考績渡劫啟動】</b><br>你的修為 (薪資) 已達標！長官準備評估你是否能升任為 <b>${nextRealm.name}</b>！`;
      
      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";

      const passBtn = document.createElement("button");
      passBtn.className = "choice-btn";
      passBtn.innerText = "⚡ 接受考績天劫審查";
      passBtn.onclick = () => {
        document.getElementById("sfx-stop").play().catch(e => {});
        const successRate = state.health / 100;
        if (Math.random() < successRate) {
          state.realmIndex++;
          addLog(`✨ 渡劫成功！升任為【${nextRealm.name}】！`);
          updateUI();
          nextTurn();
        } else {
          state.health -= 30;
          addLog(`❌ 渡劫失敗！被長官評定「態度不佳」，健康度大幅下降！`);
          updateUI();
          if (state.health > 0) nextTurn();
        }
      };
      choicesContainer.appendChild(passBtn);
    }

    function resetGame() {
      state = { realmIndex: 0, salary: 28000, age: 22, months: 0, health: 100, isDead: false };
      document.getElementById("game-log").innerHTML = "重新投胎...<br>";
      updateUI();
      nextTurn();
    }

    window.onload = () => {
      initAudio();
      initWeatherEffect();
      updateUI();
      nextTurn();
    };
  </script>
</body>
</html>
